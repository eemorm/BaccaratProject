name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 1a. Read version number (PowerShell)
      - name: Read version
        id: get_version
        shell: pwsh
        run: |
          $version = Get-Content version.txt
          Write-Host "VERSION=$version" >> $env:GITHUB_ENV

      # 2. Install MSYS2 + MinGW
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip

      # 3. Install Meson
      - name: Install Meson
        shell: msys2 {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson

      # 4. Configure Meson (portable install)
      - name: Configure build
        shell: msys2 {0}
        run: |
          meson setup build --prefix=$PWD/build/install

      # 5. Build
      - name: Build
        shell: msys2 {0}
        run: meson compile -C build

      # 6. Install
      - name: Install
        shell: msys2 {0}
        run: meson install -C build

      # 7. Copy runtime + SFML DLLs
      - name: Copy DLLs
        shell: msys2 {0}
        run: |
          mkdir -p build/install/

          # MinGW runtime
          cp /mingw64/bin/libstdc++-6.dll build/install/
          cp /mingw64/bin/libgcc_s_seh-1.dll build/install/
          cp /mingw64/bin/libwinpthread-1.dll build/install/

          # SFML
          cp libs/SFML/bin/*.dll build/install/

      # 8. Upload portable folder with version
      - name: Upload EXE + Assets + DLLs
        uses: actions/upload-artifact@v4
        with:
          name: BaccaratProject-Windows-${{ env.VERSION }}
          path: build/install/*