name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Checkout your repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Install MSYS2, Python, Meson, Ninja
      - name: Install MSYS2 and Meson
        shell: pwsh
        run: |
          choco install --yes msys2
          choco install --yes python
          python -m pip install --upgrade pip
          pip install meson ninja

      # 3. Configure Meson build
      - name: Configure build with Meson
        shell: bash
        run: |
          setx CC "cl"
          setx CXX "cl"
          mkdir -p build
          cd build
          meson setup --cross-file ../windows-cross.ini ..

      # 4. Build the game
      - name: Build
        shell: bash
        run: |
          cd build
          ninja

      # 5. Upload the compiled Windows EXE as an artifact
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Baccarat-Windows
          path: build/Baccarat.exe