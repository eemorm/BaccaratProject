name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Install MSYS2 + MinGW
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip

      # 3. Install Meson
      - name: Install Meson
        shell: msys2 {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson

      # 4. Configure Meson with portable install
      - name: Configure build
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          meson setup .. --prefix=install

      # 5. Build
      - name: Build
        shell: msys2 {0}
        run: meson compile -C build

      # 6. Install to portable folder
      - name: Install
        shell: msys2 {0}
        run: meson install -C build

      # 7. Copy SFML DLLs to bin
      - name: Copy SFML DLLs
        shell: msys2 {0}
        run: |
          cp libs/SFML/bin/*.dll build/install/bin/

      # 8. Upload the full portable install folder
      - name: Upload EXE + Resources + DLLs
        uses: actions/upload-artifact@v4
        with:
          name: Baccarat-Windows
          path: build/install/*