name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Install MSYS2 + MinGW
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config

      # 3. Install Meson
      - name: Install Meson
        shell: msys2 {0}
        run: |
          pip install meson

      # 4. Configure Meson (NO cross file)
      - name: Configure build
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          meson setup ..

      # 5. Build
      - name: Build
        shell: msys2 {0}
        run: |
          cd build
          ninja

      # 6. Upload EXE
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Baccarat-Windows
          path: build/BaccaratProject.exe